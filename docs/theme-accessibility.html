<script>
// Quarto owns theme state and persistence; supply a clear keyboard button label.
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.quarto-color-scheme-toggle').forEach(toggle => {
    toggle.setAttribute('role', 'button');
    toggle.setAttribute('aria-label', 'Toggle light and dark theme');
    toggle.setAttribute('tabindex', '0');
    toggle.addEventListener('keydown', event => {
      if (event.key === ' ' || event.key === 'Enter') {
        event.preventDefault();
        toggle.click();
      }
    });
  });
});
</script>
