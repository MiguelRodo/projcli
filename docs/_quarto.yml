project:
  type: website

website:
  title: "projcli"
  site-url: https://miguelrodo.github.io/projcli/
  description: "Run research analyses from R or the command line, with consistent project paths and a separate preview step."
  navbar:
    background: "#143b3a"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Home
      - href: install.qmd
        text: Install
      - href: tutorial.qmd
        text: Get started
      - href: features.qmd
        text: What works
      - href: r-frontend.qmd
        text: R package
    right:
      - icon: github
        href: https://github.com/MiguelRodo/projcli
        aria-label: GitHub repository
  sidebar:
    style: docked
    search: true
    contents:
      - section: Reference
        contents:
          - configuration.qmd
          - cli/build.qmd
          - cli/history.qmd
          - cli/remote.qmd
          - lifecycle.qmd
          - cli/version.qmd
          - cli/yml.qmd
          - cli/path.qmd
          - cli/ignore.qmd
          - cli/errors.qmd
      - section: R package
        contents:
          - r-frontend.qmd
          - r-reference.qmd
      - section: Storage guides
        contents:
          - xet-storage.qmd
          - cas-github.qmd
      - section: Design and progress
        contents:
          - behavior.qmd
          - compatibility.qmd
          - flow.qmd
          - remote-compatibility.qmd
          - r-wrapper-cran.qmd
          - storage-design.qmd
          - development-quality.qmd
  page-footer:
    left: "projcli · research builds, one project at a time"
    right:
      - text: Source and releases
        href: https://github.com/MiguelRodo/projcli

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    include-after-body: theme-accessibility.html
    css: styles.css
    toc: true
    code-copy: true
    link-external-newwindow: false
