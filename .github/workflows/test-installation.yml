name: Test Installation Methods

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:

  # =================================================================
  # PHASE 1: BUILD ARTIFACTS ONCE
  # =================================================================

  build-linux-artifacts:
    name: Build Linux Binary & Debian Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2

      # Installs cargo-deb via cargo install
      - name: Install cargo-deb quickly
        run: |
          cargo install cargo-deb

      - name: Validate artifact collection failure paths
        run: python -m unittest discover -s tests -p test_release_assets.py

      - name: Compile Release Binary and Debian Package
        run: |
          cargo build --release --locked
          mkdir -p dist
          cargo deb --no-build --output dist/
          # Copy raw binary to dist for the local script testing job
          python scripts/release-assets.py stage --binary target/release/proj --platform linux_amd64 --output dist

      - name: Upload Built Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/

  build-windows-artifacts:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows Binary
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "Cargo release build failed" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python scripts/release-assets.py stage --binary target/release/proj.exe --platform windows_amd64 --output dist
          if ($LASTEXITCODE -ne 0) { throw "Artifact staging failed" }

      - name: Upload Built Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/

  # =================================================================
  # PHASE 2: ENVIRONMENT DOCK TESTING (NO RE-COMPILATION)
  # =================================================================

  test-local-installation:
    name: Test Bash Installer (Clean Ubuntu)
    runs-on: ubuntu-latest
    needs: build-linux-artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bash

      # Instantly downloads the binary compiled in Phase 1
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: /tmp/fake-release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check verified replacement and rejected downloads
        run: python tests/check-installer.py --shell bash --fixture /tmp/fake-release

      - name: Run local installation script
        env:
          PROJ_DOWNLOAD_BASE_URL: "file:///tmp/fake-release"
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          bash install-local.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify proj command is available
        run: |
          which proj
          proj --help
          test -f $HOME/.local/bin/proj
          test -x $HOME/.local/bin/proj
          echo "Local Unix installation test passed successfully."

  test-debian-package:
    name: Test APT/Debian Package Profile (Clean Ubuntu)
    runs-on: ubuntu-latest
    needs: build-linux-artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: dist

      # Installs the pre-built .deb artifact to ensure package metadata/paths are sound
      - name: Install generated .deb artifact
        run: |
          sudo dpkg -i dist/*.deb

      - name: Verify debian execution profile
        run: |
          which proj
          proj --help

  test-windows-manual:
    name: Test PowerShell Installer (Clean Windows)
    runs-on: windows-latest
    needs: build-windows-artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Instantly downloads the windows binary compiled in Phase 1
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: fake-release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check verified replacement and rejected downloads
        run: python tests/check-installer.py --shell pwsh --fixture fake-release

      - name: Run install.ps1 script execution pass
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".local\bin"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $env:Path = "$installDir;$env:Path"
          $fakeRelease = Resolve-Path "fake-release"
          $env:PROJ_DOWNLOAD_BASE_URL = "file:///$($fakeRelease.Path -replace '\\', '/')"
          .\install.ps1
          Write-Host "Windows manual installation script pass complete"

      - name: Verify installed target binary state in PATH environment
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".local\bin"
          if (Test-Path (Join-Path $installDir "proj.exe")) {
            $binary = Join-Path $installDir "proj.exe"
            & $binary --help
            if ($LASTEXITCODE -ne 0) { throw "Installed help smoke failed" }
            & $binary --version
            if ($LASTEXITCODE -ne 0) { throw "Installed version smoke failed" }
          } else {
            Write-Error "proj.exe missing from installation target destination paths"
            throw "Failed"
          }

  # =================================================================
  # PHASE 3: EVALUATION SUMMARY
  # =================================================================

  test-summary:
    runs-on: ubuntu-latest
    needs: [build-linux-artifacts, build-windows-artifacts, test-local-installation, test-debian-package, test-windows-manual]
    if: always()
    steps:
      - name: Evaluate execution summary matrix statuses
        run: |
          if [ "${{ needs.test-local-installation.result }}" != "success" ]; then
            echo "Local script installation step matrix broken."
            exit 1
          fi
          if [ "${{ needs.test-debian-package.result }}" != "success" ]; then
            echo "Debian compilation packaging pipeline step broken."
            exit 1
          fi
          if [ "${{ needs.test-windows-manual.result }}" != "success" ]; then
            echo "Windows native install script tracking pass failed."
            exit 1
          fi
          echo "✅ Complete compilation & environmental deployment methods tested completely."
