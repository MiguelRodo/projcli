name: Docs validation

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - .github/workflows/docs-validation.yml

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.10.19"
          tinytex: false
      - name: Render without executing examples
        run: |
          mkdir -p validation-evidence
          git rev-parse HEAD | tee validation-evidence/pr-checkout.txt
          quarto render docs --no-execute 2>&1 | tee validation-evidence/quarto-render.txt
      - name: Install supported headless shell for lifecycle validation
        run: |
          timeout --kill-after=10s 180s quarto install chrome-headless-shell --no-prompt 2>&1 | tee validation-evidence/headless-shell-install.txt
      - name: Verify native lifecycle rendering and export its SVGs
        run: |
          timeout --kill-after=10s 90s python3 - <<'PY' 2>&1 | tee validation-evidence/lifecycle-browser-check.txt
          from functools import partial
          from html.parser import HTMLParser
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import math
          import shutil
          import subprocess
          import tempfile
          import threading
          import xml.etree.ElementTree as ET

          site = Path("docs/_site").resolve()
          evidence = Path("validation-evidence/lifecycle-svg-review").resolve()
          evidence.mkdir(parents=True, exist_ok=True)
          # Use the runner's packaged Chrome with its existing sandbox support.
          # The separately downloaded shell cannot use this runner's sandbox profile.
          browser = shutil.which("google-chrome")
          assert browser, "The runner must provide sandbox-capable Google Chrome"
          print(subprocess.check_output([browser, "--version"], text=True, timeout=10).strip(), flush=True)

          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, *_args):
                  pass
          server = ThreadingHTTPServer(("127.0.0.1", 0), partial(QuietHandler, directory=str(site)))
          threading.Thread(target=server.serve_forever, daemon=True).start()
          try:
              with tempfile.TemporaryDirectory(prefix="lifecycle-browser-") as profile:
                  result = subprocess.run([
                      browser, "--headless", "--disable-gpu", "--dump-dom",
                      "--virtual-time-budget=10000", "--timeout=20000",
                      "--window-size=1200,2200", "--user-data-dir=" + profile,
                      "--screenshot=" + str(evidence / "lifecycle-page.png"),
                      f"http://127.0.0.1:{server.server_port}/lifecycle.html",
                  ], capture_output=True, text=True, timeout=60)
              (evidence / "browser-stderr.txt").write_text(result.stderr)
              (evidence / "rendered-page.html").write_text(result.stdout)
              result.check_returncode()
          finally:
              server.shutdown()
              server.server_close()

          # Extract the browser's exact SVG serialization, preserving SVG attribute casing.
          class SvgParser(HTMLParser):
              def __init__(self, text):
                  super().__init__()
                  self.text = text
                  self.offsets = [0]
                  for line in text.splitlines(keepends=True):
                      self.offsets.append(self.offsets[-1] + len(line))
                  self.start = None
                  self.depth = 0
                  self.figures = []
                  self.feed(text)
              def position(self):
                  line, column = self.getpos()
                  return self.offsets[line - 1] + column
              def handle_starttag(self, tag, attrs):
                  if tag == "svg":
                      if self.start is not None:
                          self.depth += 1
                      elif "flowchart" in dict(attrs).get("class", "").split():
                          self.start, self.depth = self.position(), 1
              def handle_endtag(self, tag):
                  if tag == "svg" and self.start is not None:
                      self.depth -= 1
                      if self.depth == 0:
                          self.figures.append(self.text[self.start:self.position() + len("</svg>")])
                          self.start = None
          figures = SvgParser(result.stdout).figures
          assert len(figures) == 13, f"Expected thirteen browser-rendered diagrams, found {len(figures)}"
          for index, text in enumerate(figures, 1):
              svg = ET.fromstring(text)
              assert svg.tag == "{http://www.w3.org/2000/svg}svg"
              viewbox = [float(value) for value in svg.attrib["viewBox"].split()]
              assert len(viewbox) == 4 and all(math.isfinite(v) and v > 0 for v in viewbox[2:])
              nodes = sum("node" in el.attrib.get("class", "").split() for el in svg.iter())
              assert nodes > 0
              (evidence / f"diagram-{index}.svg").write_text(text)
              print(f"PASS browser-rendered SVG {index}: {nodes} nodes; viewBox={svg.attrib['viewBox']}")
          assert (evidence / "lifecycle-page.png").stat().st_size > 1000
          PY
      - name: Inspect R package pages and exported function coverage
        run: |
          python3 - <<'PY' 2>&1 | tee validation-evidence/r-package-pages.txt
          from functools import partial
          from html.parser import HTMLParser
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import re, shutil, subprocess, tempfile, threading
          site=Path("docs/_site").resolve()
          evidence=Path("validation-evidence/r-package-review").resolve()
          evidence.mkdir(parents=True,exist_ok=True)
          class MainText(HTMLParser):
              def __init__(self,text):
                  super().__init__();self.active=False;self.text=[];self.feed(text)
              def handle_starttag(self,tag,attrs):
                  if tag=="main":self.active=True
              def handle_endtag(self,tag):
                  if tag=="main":self.active=False
              def handle_data(self,text):
                  if self.active:self.text.append(text)
          exports=re.findall(r"export\((\w+)\)",Path("frontends/r/projcli/NAMESPACE").read_text())
          reference=" ".join(MainText((site/"r-reference.html").read_text()).text)
          assert exports and all(name in reference for name in exports), "Missing exported function reference"
          guide=" ".join(" ".join(MainText((site/"r-frontend.html").read_text()).text).split())
          assert "not on CRAN" in guide and "preview.5" in guide and "Quick start" in guide
          home=" ".join(" ".join(MainText((site/"index.html").read_text()).text).split())
          assert "Work from R" in home and "Start from R" in home
          assert "projr_build_dev" in home and "not on CRAN" in home
          browser=shutil.which("google-chrome");assert browser
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*_):pass
          server=ThreadingHTTPServer(("127.0.0.1",0),partial(Quiet,directory=str(site)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          try:
              for page in ["index","r-frontend","r-reference"]:
                  with tempfile.TemporaryDirectory(prefix="r-doc-browser-") as profile:
                      result=subprocess.run([browser,"--headless","--disable-gpu","--dump-dom",
                          "--virtual-time-budget=5000","--timeout=20000","--window-size=1400,2400",
                          "--user-data-dir="+profile,"--screenshot="+str(evidence/(page+".png")),
                          f"http://127.0.0.1:{server.server_port}/{page}.html"],
                          capture_output=True,text=True,timeout=60)
                  result.check_returncode()
                  (evidence/(page+".html")).write_text(result.stdout)
                  assert (evidence/(page+".png")).stat().st_size>1000
                  print("PASS native browser R page:",page,flush=True)
          finally:
              server.shutdown();server.server_close()
          print("PASS documented exports:",len(exports))
          PY
      - name: Check rendered navigation and local links
        run: |
          python3 - <<'PY' 2>&1 | tee validation-evidence/links.txt
          """Check local rendered links, assets and fragment identifiers."""
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          
          site = Path("docs/_site").resolve()
          class Page(HTMLParser):
              def __init__(self, path):
                  super().__init__()
                  self.ids = set()
                  self.links = []
                  self.navbar_links = []
                  self.in_navbar = False
                  self.feed(path.read_text())
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "nav" and "navbar" in attrs.get("class", "").split():
                      self.in_navbar = True
                  if self.in_navbar and tag == "a" and "nav-link" in attrs.get("class", "").split():
                      self.navbar_links.append(attrs)
                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  for attr in ("href", "src"):
                      if attr in attrs:
                          self.links.append(attrs[attr])
              def handle_endtag(self, tag):
                  if tag == "nav":
                      self.in_navbar = False
          
          pages = {path: Page(path) for path in site.rglob("*.html")}
          for name in ("index.html", "install.html", "tutorial.html", "features.html", "r-frontend.html"):
              navbar = pages[site / name].navbar_links
              active = [a for a in navbar if "active" in a.get("class", "").split()]
              current = [a for a in navbar if a.get("aria-current") == "page"]
              assert active == current and len(active) == 1, (name, active, current)
              assert Path(urlsplit(active[0]["href"]).path).name == name, (name, active)
          print("PASS: each top-level navbar marks only its own page active and aria-current")
          errors = []
          for source, page in pages.items():
              for link in page.links:
                  url = urlsplit(link)
                  if url.scheme or url.netloc:
                      continue
                  path = unquote(url.path)
                  if path.startswith("/projcli/"):
                      target = site / path[len("/projcli/"):]
                  elif path.startswith("/"):
                      target = site / path.lstrip("/")
                  else:
                      target = source.parent / path if path else source
                  target = target.resolve()
                  if target.is_dir():
                      target /= "index.html"
                  if not target.exists():
                      errors.append(f"{source.relative_to(site)}: missing {link}")
                  elif url.fragment and target in pages and unquote(url.fragment) not in pages[target].ids:
                      errors.append(f"{source.relative_to(site)}: missing fragment {link}")
          assert not errors, "\n".join(errors[:30])
          print(f"PASS: local links, assets and fragments across {len(pages)} rendered pages")
          PY
      - name: Prepare example checker from authored fences
        run: |
          cat > validation-evidence/check-examples.py <<'PY'
          """Validate the actual fenced examples against a supplied proj executable."""
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import shlex
          import tempfile
          
          root = Path.cwd()
          binary = str(Path(sys.argv[1]).resolve())
          
          def run(command, **kwargs):
              print("+ " + shlex.join(command), flush=True)
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, **kwargs)
              print(result.stdout, end="", flush=True)
              result.check_returncode()
              return result.stdout
          
          for page, filename, expected in [
              ("README.md", "mean.txt", "12\n"),
              ("docs/tutorial.qmd", "summary.csv", "count,mean\n3,12\n"),
          ]:
              text = (root / page).read_text()
              config = re.search(r"```yaml\n(.*?)```", text, re.S).group(1)
              analysis = re.search(r"```python\n(.*?)```", text, re.S).group(1)
              with tempfile.TemporaryDirectory(prefix="projcli-docs-") as temporary:
                  project = Path(temporary)
                  (project / "_proj.yml").write_text(config)
                  (project / "analysis.py").write_text(analysis)
                  env = dict(os.environ)
                  for name in ("PROJ_PROJECT_ROOT", "PROJR_PROFILE", "QUARTO_PROFILE", "PROJR_CLEAR_OUTPUT"):
                      env.pop(name, None)
                  before = {p.name: p.read_bytes() for p in project.iterdir()}
                  run([binary, "--project", ".", "yml", "read"], cwd=project, env=env)
                  assert before == {p.name: p.read_bytes() for p in project.iterdir()}, "validation changed the project"
                  run([binary, "--project", ".", "--non-interactive", "build-dev"],
                      cwd=project, env=env)
                  result = project / "_tmp" / "preview" / filename
                  assert result.read_text() == expected, (page, result.read_text())
                  print(f"Output {filename}:\n{result.read_text()}", flush=True)
                  assert not (project / "VERSION").exists(), "preview created VERSION"
                  assert not (project / ".gitignore").exists(), "preview changed ignores"
                  assert not (project / ".Rbuildignore").exists(), "preview changed ignores"
                  assert before == {p.name: p.read_bytes() for p in project.iterdir() if p.is_file()}, "preview changed inputs"
                  path = run([binary, "--project", ".", "path", "get", "--label", "cache"],
                             cwd=project, env=env).strip()
                  assert (project / Path(path)).resolve() == (project / "_tmp").resolve(), path
                  print(f"PASS {page}: real configuration, CLI validation, preview and output")
          
          print(f"Validated using {binary}")
          PY
      - name: Install using the documented pinned Linux command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          readme = Path("README.md").read_text()
          guide = Path("docs/install.qmd").read_text()
          snippet = re.search(r"```bash\n(.*?)```", readme, re.S).group(1)
          assert snippet == re.search(r"```bash\n(.*?)```", guide, re.S).group(1), "install snippets diverged"
          Path("validation-evidence/install-linux.sh").write_text(snippet)
          PY
          bash --noprofile --norc -e -o pipefail validation-evidence/install-linux.sh 2>&1 | tee validation-evidence/release-install.txt
          test -x "$HOME/.local/bin/proj"
          test "$("$HOME/.local/bin/proj" --version)" = "proj 0.4.0-preview.5"
          curl -fsSL https://github.com/MiguelRodo/projcli/releases/download/v0.4.0-preview.5/source-commit.txt | tee validation-evidence/release-source.txt
          test "$(cat validation-evidence/release-source.txt)" = "87b5149c679a87796513e775c54ba98e4811aa9b"
      - name: Run documented examples using the downloaded preview
        run: python3 validation-evidence/check-examples.py "$HOME/.local/bin/proj" 2>&1 | tee validation-evidence/release-examples.txt
      - name: Build the exact PR core revision
        run: cargo build --locked --bin proj 2>&1 | tee validation-evidence/pr-build.txt
      - name: Run documented examples using PR core revision
        run: python3 validation-evidence/check-examples.py target/debug/proj 2>&1 | tee validation-evidence/pr-examples.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-preview-and-validation
          path: |
            docs/_site
            validation-evidence
          retention-days: 7

  windows-install-docs:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run the documented pinned Windows command
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force validation-evidence | Out-Null
          $markdown = Get-Content -Raw docs/install.qmd
          $match = [regex]::Match($markdown, '```powershell\r?\n(.*?)```', [Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $match.Success) { throw 'Missing documented PowerShell installer command' }
          Set-Content -LiteralPath validation-evidence/install-windows.ps1 -Value $match.Groups[1].Value
          Start-Transcript -Path validation-evidence/windows-install.txt
          try {
            & ./validation-evidence/install-windows.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Documented installation command failed' }
            $binary = Join-Path $env:USERPROFILE '.local\bin\proj.exe'
            $version = (& $binary --version).Trim()
            if ($version -cne 'proj 0.4.0-preview.5') { throw "Unexpected installed version: $version" }
            & $binary --help
            if ($LASTEXITCODE -ne 0) { throw 'Installed binary help failed' }
            Get-FileHash -Algorithm SHA256 -LiteralPath $binary | Format-List
          } finally {
            Stop-Transcript
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-install-docs-validation
          path: validation-evidence
          retention-days: 7
