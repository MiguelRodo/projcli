name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  rust-tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Automatically configures the toolchain AND handles smart caching for dependencies
      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # Runs unit, integration, binary, AND documentation tests in a single optimized pass
      - name: Run Complete Test Suite
        run: cargo test --workspace --verbose


      - name: Retain resolved dependency lock for exact-head verification
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-dependency-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
