name: Diagnostic relative paths (unmerged)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SATVILab/projr
          ref: 90be50132d16aee33e39c0f7f35ef906c35f5397
          path: diagnostic-projr
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false
      - name: Install remote diagnostic dependencies and unchanged pinned projr
        run: |
          python -m pip install PyYAML
          Rscript --vanilla -e 'options(Ncpus=2); install.packages(c("renv","jsonlite","yaml","rprojroot","desc","fs","digest","cli","glue","rmarkdown","knitr","png"), repos=Sys.getenv("RSPM", unset="https://cloud.r-project.org"))'
          test "$(git -C diagnostic-projr rev-parse HEAD)" = 90be50132d16aee33e39c0f7f35ef906c35f5397
          R CMD INSTALL --no-multiarch diagnostic-projr
          Rscript --vanilla -e 'library(projr); cat("Installed projr:", as.character(packageVersion("projr")), "\n"); cat("rmarkdown:", as.character(packageVersion("rmarkdown")), "knitr:", as.character(packageVersion("knitr")), "\n")'
      - name: Download checksum-pinned released CLI (no Rust compilation)
        run: |
          curl -fsSL https://github.com/MiguelRodo/projcli/releases/download/v0.4.0-preview.1/proj_0.4.0-preview.1_linux_amd64 -o diagnostic-proj
          echo '99c018f7dc676d8aad3d6f6f5aa0e3a8449fb1b92ea8489d1e3f0c0f2cb470b4  diagnostic-proj' | sha256sum --check
          chmod u+x diagnostic-proj
      - name: Exercise real runners, paths and relocated HTML resources
        run: python diagnostics/relative-paths/run.py
      - name: Verify reference source unchanged
        if: always()
        run: git -C diagnostic-projr diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relative-path-diagnostics
          path: diagnostic-results/
