name: Pinned path contract acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.*'
      - '.github/workflows/path-contract-acceptance.yml'
jobs:
  pinned-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/miguelrodo/devcontainers-projcli@sha256:a58a8a4dd6f0be83879d08b3a43ab92e256425bbfb81372b257d77a7ff9077f9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tool versions
        shell: bash
        run: |
          cargo --version
          Rscript --version
          quarto --version
          python3 --version
      - name: Prepare the configured unprivileged image user
        shell: bash
        run: |
          chown -R rstudio:rstudio "$GITHUB_WORKSPACE"
          install -d -o rstudio -g rstudio "$RUNNER_TEMP/projcli-cargo"
      - name: Complete Linux regressions in pinned environment
        shell: bash
        run: runuser -u rstudio -- env CARGO_HOME="$RUNNER_TEMP/projcli-cargo" RUSTUP_AUTO_INSTALL=0 cargo test --locked --workspace --verbose --no-fail-fast
      - name: Rust API documentation in pinned environment
        shell: bash
        run: runuser -u rstudio -- env CARGO_HOME="$RUNNER_TEMP/projcli-cargo" RUSTUP_AUTO_INSTALL=0 cargo doc --locked --no-deps
      - name: Actual CLI R Python and embedded HTML acceptance
        shell: bash
        run: runuser -u rstudio -- python3 tests/acceptance/path_contract.py target/debug/proj --evidence path-contract-evidence.json
      - name: Script groups and complete Quarto website output
        shell: bash
        run: runuser -u rstudio -- python3 tests/acceptance/script_groups.py target/debug/proj --evidence script-groups-evidence.json
      - name: Combined M1 actual CLI acceptance
        shell: bash
        run: runuser -u rstudio -- python3 tests/acceptance/m1_contract.py target/debug/proj --evidence m1-contract-evidence.json --artifacts m1-acceptance-artifacts
      - name: Validate actual final and archived M1 result bytes
        shell: bash
        run: runuser -u rstudio -- env CARGO_HOME="$RUNNER_TEMP/projcli-cargo" RUSTUP_AUTO_INSTALL=0 PROJCLI_M1_EVIDENCE="$GITHUB_WORKSPACE/m1-acceptance-artifacts" cargo test --locked --test test_m1_archive_witness -- --ignored
      - name: Mixed-document failure then smaller successful Git build
        shell: bash
        run: |
          runuser -u rstudio -- python3 -m unittest discover -s tests/acceptance -p test_mixed_render_retry.py
          runuser -u rstudio -- python3 tests/acceptance/mixed_render_retry.py target/debug/proj --evidence mixed-render-retry-evidence.json --artifacts mixed-render-retry-artifacts
      - name: Integrated M2 local traceability and recovery
        shell: bash
        run: runuser -u rstudio -- python3 tests/acceptance/m2_contract.py target/debug/proj --evidence m2-contract-evidence.json --artifacts m2-acceptance-artifacts
      - name: Validate M2 record source and exact inventory bytes
        shell: bash
        run: runuser -u rstudio -- env CARGO_HOME="$RUNNER_TEMP/projcli-cargo" RUSTUP_AUTO_INSTALL=0 PROJCLI_M2_EVIDENCE="$GITHUB_WORKSPACE/m2-acceptance-artifacts" cargo test --locked --test test_m2_contract_witness -- --ignored
      - name: Integrated M3 build archive verify and fresh-project recovery
        shell: bash
        run: runuser -u rstudio -- python3 tests/acceptance/m3_contract.py target/debug/proj --evidence m3-contract-evidence.json --artifacts m3-acceptance-artifacts
      - name: Validate M3 stored and recovered byte membership independently
        shell: bash
        run: runuser -u rstudio -- env CARGO_HOME="$RUNNER_TEMP/projcli-cargo" RUSTUP_AUTO_INSTALL=0 PROJCLI_M3_EVIDENCE="$GITHUB_WORKSPACE/m3-acceptance-artifacts" cargo test --locked --test test_m3_contract_witness -- --ignored
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: path-contract-evidence
          path: path-contract-evidence.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-combined-evidence
          path: |
            m1-contract-evidence.json
            m1-acceptance-artifacts
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-render-retry-evidence
          path: |
            mixed-render-retry-evidence.json
            mixed-render-retry-artifacts
          if-no-files-found: warn


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-contract-evidence
          path: |
            m2-contract-evidence.json
            m2-acceptance-artifacts
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-contract-evidence
          path: |
            m3-contract-evidence.json
            m3-acceptance-artifacts
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: script-groups-evidence
          path: script-groups-evidence.json
          if-no-files-found: warn
