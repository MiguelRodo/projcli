name: R subprocess adapter
on:
  workflow_dispatch:
    inputs:
      representative_reanalysis:
        description: Run the explicit bounded public Weisberger migration gate
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'frontends/r/**'
      - 'src/**'
      - 'Cargo.*'
      - 'tests/test_yml_queries.rs'
      - 'tests/acceptance/r_frontend_renderers.R'
      - 'tests/acceptance/r_frontend_renv.R'
      - 'tests/acceptance/r_frontend_reanalysis.*'
      - '.github/workflows/r-adapter.yml'
jobs:
  pinned-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/miguelrodo/devcontainers-projcli@sha256:a58a8a4dd6f0be83879d08b3a43ab92e256425bbfb81372b257d77a7ff9077f9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare separate published compatibility binary
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          base='https://github.com/MiguelRodo/projcli/releases/download/v0.4.0-preview.4/'
          target=Path('adapter-cli');target.mkdir()
          for name in ['source-commit.txt','proj_0.4.0-preview.4_linux_amd64']:
              urllib.request.urlretrieve(base+name,target/name)
          assert (target/'source-commit.txt').read_text().strip()=='f6f4510a806ea302a2ceee5177707fbde9bed5bf'
          binary=target/'proj_0.4.0-preview.4_linux_amd64'
          assert hashlib.sha256(binary.read_bytes()).hexdigest()=='31ffa1732f8ee4da9bcf15540a53abeee741a8aca23eeca26f5a94ac6aa8a7f0'
          binary.chmod(0o755)
          source=Path('adapter-cli/renv_1.1.5.tar.gz')
          urllib.request.urlretrieve('https://cran.r-project.org/src/contrib/Archive/renv/renv_1.1.5.tar.gz',source)
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='3ee996c65989bc5ea3914fbceb3794b00c7daab7eda49dce64048012ea0406b2'
          PY
          chown -R rstudio:rstudio "$GITHUB_WORKSPACE"
          install -d -o rstudio -g rstudio "$RUNNER_TEMP/r-adapter-library"
          runuser -u rstudio -- R CMD INSTALL --library="$RUNNER_TEMP/r-adapter-library" adapter-cli/renv_1.1.5.tar.gz
      - name: Check package without the optional CLI
        shell: bash
        run: |
          Rscript --vanilla -e 'stopifnot(requireNamespace("processx",quietly=TRUE),requireNamespace("jsonlite",quietly=TRUE))'
          runuser -u rstudio -- env R_LIBS_USER="$RUNNER_TEMP/r-adapter-library" R CMD build frontends/r/projcli
          runuser -u rstudio -- env R_LIBS_USER="$RUNNER_TEMP/r-adapter-library" R CMD check --no-manual --no-build-vignettes projcli_0.0.0.9000.tar.gz
          python3 -c 'from pathlib import Path; assert "Status: OK" in Path("projcli.Rcheck/00check.log").read_text().splitlines(), "R package check must be clean"'
      - name: Required actual CLI R integration
        shell: bash
        run: |
          runuser -u rstudio -- R CMD INSTALL --library="$RUNNER_TEMP/r-adapter-library" frontends/r/projcli
          runuser -u rstudio -- env R_LIBS_USER="$RUNNER_TEMP/r-adapter-library" PROJCLI_R_TEST_BINARY="$GITHUB_WORKSPACE/adapter-cli/proj_0.4.0-preview.4_linux_amd64" Rscript --vanilla frontends/r/projcli/tests/transport.R
      - name: Required candidate-core configuration API integration
        shell: bash
        run: |
          install -d -o rstudio -g rstudio "$RUNNER_TEMP/r-adapter-cargo"
          runuser -u rstudio -- env CARGO_HOME="$RUNNER_TEMP/r-adapter-cargo" RUSTUP_AUTO_INSTALL=0 cargo build --locked --bin proj
          runuser -u rstudio -- env R_LIBS_USER="$RUNNER_TEMP/r-adapter-library" PROJCLI_R_API_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/proj" Rscript --vanilla frontends/r/projcli/tests/configuration.R
          runuser -u rstudio -- env R_LIBS_USER="$RUNNER_TEMP/r-adapter-library" PROJCLI_R_API_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/proj" Rscript --vanilla frontends/r/projcli/tests/project.R
          runuser -u rstudio -- env R_LIBS_USER="$RUNNER_TEMP/r-adapter-library" PROJCLI_R_API_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/proj" Rscript --vanilla frontends/r/projcli/tests/sessions.R
          runuser -u rstudio -- env R_LIBS_USER="$RUNNER_TEMP/r-adapter-library" PROJCLI_R_API_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/proj" PROJCLI_R_RENDER_TESTS_REQUIRED=1 Rscript --vanilla tests/acceptance/r_frontend_renderers.R
          runuser -u rstudio -- env R_LIBS_USER="$RUNNER_TEMP/r-adapter-library" PROJCLI_R_RENV_TESTS_REQUIRED=1 Rscript --vanilla tests/acceptance/r_frontend_renv.R
      - name: Explicit named Weisberger reanalysis
        if: github.event_name == 'workflow_dispatch' && inputs.representative_reanalysis
        timeout-minutes: 35
        shell: bash
        run: |
          install -d -o rstudio -g rstudio "$RUNNER_TEMP/m4-reanalysis-work"
          runuser -u rstudio -- env R_LIBS_USER="$RUNNER_TEMP/r-adapter-library" PROJCLI_R_REANALYSIS_REQUIRED=1 TMPDIR="$RUNNER_TEMP/m4-reanalysis-work" python3 tests/acceptance/r_frontend_reanalysis.py --binary "$GITHUB_WORKSPACE/target/debug/proj" --evidence "$GITHUB_WORKSPACE/r-frontend-reanalysis-evidence"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.representative_reanalysis
        with:
          name: r-frontend-weisberger-metadata
          path: r-frontend-reanalysis-evidence/*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-adapter-pinned-check
          path: projcli.Rcheck
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
      - name: Prepare R dependencies and pinned compatibility binary
        shell: Rscript {0}
        run: |
          install.packages(c("processx", "jsonlite"), repos = "https://cloud.r-project.org")
          dir.create("adapter-cli")
          base <- "https://github.com/MiguelRodo/projcli/releases/download/v0.4.0-preview.4/"
          download.file(paste0(base, "source-commit.txt"), "adapter-cli/source-commit.txt", mode = "wb")
          stopifnot(readLines("adapter-cli/source-commit.txt") == "f6f4510a806ea302a2ceee5177707fbde9bed5bf")
          download.file(paste0(base, "proj_0.4.0-preview.4_windows_amd64.exe"), "adapter-cli/proj.exe", mode = "wb")
      - name: Verify native Windows asset checksum
        shell: pwsh
        run: |
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath adapter-cli/proj.exe).Hash.ToLowerInvariant()
          if ($actual -cne '92a5b7626a39f09d78b0661b43e183d8c87c4b382f7e13616bd228121b43a378') { throw 'Pinned CLI hash mismatch' }
      - name: Prepare pinned optional renv test dependency
        shell: pwsh
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://cran.r-project.org/src/contrib/Archive/renv/renv_1.1.5.tar.gz','adapter-cli/renv_1.1.5.tar.gz')"
          if ($LASTEXITCODE -ne 0) { throw 'Optional test source download failed' }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath adapter-cli/renv_1.1.5.tar.gz).Hash.ToLowerInvariant()
          if ($actual -cne '3ee996c65989bc5ea3914fbceb3794b00c7daab7eda49dce64048012ea0406b2') { throw 'Optional test source checksum mismatch' }
          & R.exe CMD INSTALL adapter-cli/renv_1.1.5.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Optional test dependency installation failed' }
      - name: R-only package check and required native integration
        shell: pwsh
        run: |
          & R.exe CMD build frontends/r/projcli
          if ($LASTEXITCODE -ne 0) { throw 'R package build failed' }
          & R.exe CMD check --no-manual --no-build-vignettes projcli_0.0.0.9000.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'R-only package check failed' }
          if (-not (Select-String -LiteralPath projcli.Rcheck/00check.log -Pattern '^Status: OK$' -Quiet)) { throw 'R package check must be clean' }
          & R.exe CMD INSTALL frontends/r/projcli
          if ($LASTEXITCODE -ne 0) { throw 'R package install failed' }
          $env:PROJCLI_R_TEST_BINARY = (Resolve-Path adapter-cli/proj.exe).Path
          & Rscript.exe --vanilla frontends/r/projcli/tests/transport.R
          if ($LASTEXITCODE -ne 0) { throw 'Required actual CLI integration failed' }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Required candidate-core configuration API integration
        shell: pwsh
        run: |
          cargo build --locked --bin proj
          if ($LASTEXITCODE -ne 0) { throw 'Candidate CLI build failed' }
          $env:PROJCLI_R_API_TEST_BINARY = (Resolve-Path target/debug/proj.exe).Path
          & Rscript.exe --vanilla frontends/r/projcli/tests/configuration.R
          if ($LASTEXITCODE -ne 0) { throw 'Required configuration API integration failed' }
          & Rscript.exe --vanilla frontends/r/projcli/tests/project.R
          if ($LASTEXITCODE -ne 0) { throw 'Required project API integration failed' }
          & Rscript.exe --vanilla frontends/r/projcli/tests/sessions.R
          if ($LASTEXITCODE -ne 0) { throw 'Required R session integration failed' }
          $env:PROJCLI_R_RENV_TESTS_REQUIRED = "1"
          & Rscript.exe --vanilla tests/acceptance/r_frontend_renv.R
          if ($LASTEXITCODE -ne 0) { throw 'Required explicit dependency restoration failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-adapter-windows-check
          path: projcli.Rcheck
          if-no-files-found: warn
