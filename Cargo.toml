[package]
name = "proj"
version = "0.4.0-preview.2"
edition = "2024"

[dependencies]
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
csv = "1.4.0"
md5 = "0.8.0"
anyhow = "1.0.102"
blake3 = "1.8.5"
camino = { version = "1.2.2", features = ["serde1"] }
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
glob = "0.3.3"
log = "0.4.29"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yaml = "0.9.34"
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"
